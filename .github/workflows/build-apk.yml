name: Smart Solar APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Smart Solar APK
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare SmartSolar.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk SmartSolar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartSolar-APK
          path: SmartSolar.apk
          if-no-files-found: error
          retention-days: 30
